name: Mantieni attivo il controllo

# GitHub sospende i workflow programmati dei repository senza attività da
# 60 giorni: una volta a settimana li riattiva via API (nessun commit).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  riattiva:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Riattiva il workflow di controllo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/controllo.yml/enable"
